services:
  mongodb:
    image: mongo:7.0
    container_name: footballdb-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: footballdb
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./data/json:/docker-entrypoint-initdb.d
    networks:
      - footballdb-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s

  mongo-express:
    image: mongo-express:latest
    container_name: footballdb-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - footballdb-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: footballdb-frontend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      # Preparamos la variable para cuando se agregue y conecte el backend
      # - NEXT_PUBLIC_API_URL=http://backend:3000/api 
    networks:
      - footballdb-net

volumes:
  mongodb_data:
  mongodb_config:

networks:
  footballdb-net:
    driver: bridge
